<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>PrId via referrer</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 1.3em; }
  .box { background: #f5f5f5; border-radius: 8px; padding: 14px 18px; word-break: break-all; font-family: monospace; font-size: 0.9em; margin: 10px 0; }
  .prid { font-size: 1.4em; font-weight: bold; color: #b45309; background: #fef3c7; padding: 10px 14px; border-radius: 8px; display: inline-block; margin: 10px 0; }
  .empty { color: #999; font-style: italic; }
  .warn { font-size: 0.9em; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; padding: 10px 14px; }
</style>
</head>
<body>

<h1>PrId via referrer</h1>

<h2>Referrer (ruwe waarde)</h2>
<div class="box" id="referrer">-</div>

<h2>Gevonden PrId</h2>
<div id="pridResult"></div>

<div class="warn" id="diagnosis"></div>

<script>
function extractPrId(str) {
  if (!str) return null;
  const match = str.match(/[?&#]prid=([^&#]+)/i);
  return match ? decodeURIComponent(match[1]) : null;
}

const ref = document.referrer;
document.getElementById('referrer').textContent = ref || '(leeg — geen referrer meegekregen)';

const prid = extractPrId(ref);
document.getElementById('pridResult').innerHTML = prid
  ? '<div class="prid">' + prid + '</div>'
  : '<span class="empty">Geen PrId gevonden</span>';

let diagnosis;
if (!ref) {
  diagnosis = 'De referrer is helemaal leeg. Mogelijke oorzaken: de AFAS-knop opent deze pagina met rel="noreferrer"/"noopener", of de browser/organisatie blokkeert referrers standaard.';
} else if (prid) {
  diagnosis = 'Werkt: de PrId kwam gewoon mee in de referrer.';
} else {
  try {
    const url = new URL(ref);
    if (url.pathname === '/' || url.pathname === '') {
      diagnosis = 'De referrer bevat alleen het domein (' + url.origin + '), geen pad of query string. Dit is de standaard "strict-origin-when-cross-origin" policy van de browser bij cross-origin navigatie — AFAS zou een soepelere Referrer-Policy moeten sturen om het pad/de PrId door te geven, en dat kunnen wij hier niet afdwingen.';
    } else {
      diagnosis = 'De referrer bevat wel een pad, maar geen herkenbare prid-parameter. Check de exacte opbouw hierboven.';
    }
  } catch (e) {
    diagnosis = 'Kon de referrer niet parsen als URL.';
  }
}
document.getElementById('diagnosis').textContent = diagnosis;
</script>

</body>
</html>
